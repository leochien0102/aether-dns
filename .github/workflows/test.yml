name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Rust tests (host)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check out pinned proxy configuration fixtures
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: leochien0102/aether-proxy
          ref: f846efdad0d2c02c883132a6cf84529e2a30ea30
          path: .proxy-fixtures
          sparse-checkout: tests/fixtures
          persist-credentials: false
      - name: Run Rust test suite
        env:
          AETHER_PROXY_FIXTURES: ${{ github.workspace }}/.proxy-fixtures/tests/fixtures
        run: cargo test --locked
